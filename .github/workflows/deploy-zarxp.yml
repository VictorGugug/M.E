name: Deploy ZarXP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ZarXP/**"
      - ".github/workflows/deploy-zarxp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZarXP/package-lock.json
      - run: npm ci
        working-directory: ZarXP
      - run: npm run build
        working-directory: ZarXP
      - run: cp dist/index.html dist/404.html
        working-directory: ZarXP
      - run: touch dist/.nojekyll
        working-directory: ZarXP
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ZarXP/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
